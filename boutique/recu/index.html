<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Réception du colis</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F1B3D;--soft:#5B6478;--line:#E3E8F2;--bg:#F4F6FB;--main:#1736A6;--ok:#12A150;--okbg:#E3F5EA;--or:#B7791F;--orbg:#FFF6E5}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:28px 16px calc(28px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
.carte{width:100%;max-width:440px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 36px rgba(15,27,61,.08);padding:30px 24px 24px;text-align:center;align-self:flex-start}
.rond{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;background:var(--okbg);display:grid;place-items:center}
.rond svg{width:46px;height:46px;fill:none;stroke:var(--ok);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.rond.anim circle,.rond.anim path{stroke-dasharray:100;stroke-dashoffset:100;animation:trait .7s ease forwards}.rond.anim path{animation-delay:.45s}
.rond.bleu{background:#EEF3FF}.rond.bleu svg{stroke:var(--main)}
.rond.orange{background:var(--orbg)}.rond.orange svg{stroke:var(--or)}
@keyframes trait{to{stroke-dashoffset:0}}
h1{font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.sous{color:var(--soft);font-size:15.5px;line-height:1.5;margin-top:8px}
.etape{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--main);background:#EEF3FF;border-radius:999px;padding:5px 11px;margin-bottom:14px}
.cadeau{display:flex;gap:14px;align-items:center;text-align:left;border:1px solid #F1D9A8;background:linear-gradient(180deg,#FFFBF2,#FFF5E1);border-radius:16px;padding:14px 16px;margin-top:20px}
.cadeau .ic{flex:0 0 auto;width:46px;height:46px;border-radius:12px;background:#fff;border:1px solid #F1D9A8;display:grid;place-items:center}
.cadeau .ic svg{width:24px;height:24px;fill:none;stroke:var(--or);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cadeau b{display:block;font-size:15px}.cadeau span{font-size:13.5px;color:#6B5A33;line-height:1.45}
.liste{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;cursor:pointer;border-radius:14px;padding:15px;font:700 15.5px Inter,sans-serif;text-decoration:none;color:#fff;background:var(--main)}
.btn.vert{background:#128C4A}
.btn.clair{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.lien{background:none;color:var(--soft);font-weight:600;padding:10px}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.apercu{margin-top:18px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#F8FAFD}
.apercu img{display:block;width:100%;max-height:320px;object-fit:contain}
.conseil{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#EEF3FF;border-radius:14px;padding:14px 16px;margin-top:16px;font-size:14.5px;line-height:1.5;color:#1D2A57}
.conseil svg{flex:0 0 auto;width:22px;height:22px;fill:none;stroke:var(--main);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.conseil.or{background:var(--orbg);color:#5C4512}.conseil.or svg{stroke:var(--or)}
.charge{padding:40px 0;color:var(--soft);font-size:15px}
.spin{width:34px;height:34px;margin:0 auto 14px;border:3px solid var(--line);border-top-color:var(--main);border-radius:50%;animation:t .8s linear infinite}
@keyframes t{to{transform:rotate(360deg)}}
.erreur .rond{background:#FFF1E6}.erreur .rond svg{stroke:#C2410C}
.cache{display:none}
@media (prefers-reduced-motion:reduce){.rond.anim circle,.rond.anim path{animation:none;stroke-dashoffset:0}}
</style>
</head>
<body>
<main class="carte" id="z"><div class="charge"><div class="spin"></div>Chargement…</div></main>
<input type="file" accept="image/*" capture="environment" id="camera" class="cache">
<input type="file" accept="image/*" id="galerie" class="cache">
<script>
(function(){
  var API = "https://script.google.com/macros/s/AKfycbwgdtcXlXB9niD3hactnz4SLIrpY_q74iQQZwkr1vrUBjczfCCVWwamG69uqnUQZsba/exec";
  var Q = new URLSearchParams(location.search), z = document.getElementById('z'), c = Q.get('c') || '';
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(x){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]; }); };
  var I = {
    coche: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" pathLength="100"/><path d="M7.6 12.4l3 3 5.8-6.2" pathLength="100"/></svg>',
    info: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v5.5M12 16.5h.01"/></svg>',
    photo: '<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg>',
    galerie: '<svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M20.5 16l-5-5-8 8.5"/></svg>',
    horloge: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>',
    cadeau: '<svg viewBox="0 0 24 24"><rect x="3.5" y="9" width="17" height="11.5" rx="1.5"/><path d="M2.8 9h18.4V6.2H2.8zM12 6.2v14.3M12 6.2C10.5 3 7 3 7 4.8s3 1.4 5 1.4zM12 6.2c1.5-3.2 5-3.2 5-1.4s-3 1.4-5 1.4z"/></svg>',
    telecharger: '<svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/></svg>',
    tel: '<svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>'
  };
  var rond = function(icone, cls, anim){ return '<div class="rond ' + (cls || '') + (anim ? ' anim' : '') + '">' + icone + '</div>'; };
  var R = {};   // infos de la commande renvoyées par le serveur
  function erreur(titre, t){
    z.className = 'carte erreur';
    z.innerHTML = rond(I.info) + '<h1>' + esc(titre || 'Lien non valide') + '</h1><p class="sous">' + esc(t) + '</p>';
  }
  function appel(o){ o.c = c; o.v = v; return fetch(API, {method: 'POST', body: JSON.stringify(o)}).then(function(r){ return r.json(); }); }
  function attente(t){ z.className = 'carte'; z.innerHTML = '<div class="charge"><div class="spin"></div>' + esc(t) + '</div>'; }
  function blocCadeau(){
    if (!R.bonus) return '';
    return '<div class="cadeau"><div class="ic">' + I.cadeau + '</div><div><b>Votre cadeau : « ' + esc(R.bonus.titre) + ' »</b><span>Un guide de ' + esc(R.bonus.pages) + ' pages offert, à télécharger dès que votre photo est validée.</span></div></div>';
  }
  function boutonCadeau(){
    if (!R.bonus) return '';
    return '<div class="liste"><a class="btn vert" href="' + esc(R.bonus.url) + '" target="_blank" rel="noopener" download>' + I.telecharger + 'Télécharger mon guide offert (PDF)</a></div>';
  }
  var p = function(){ return R.prenom ? ' ' + esc(R.prenom) : ''; };

  // Étape 1 : demander la photo du produit reçu
  function demanderPhoto(message){
    z.className = 'carte';
    z.innerHTML = '<span class="etape">Dernière étape</span>' + rond(I.photo, 'bleu')
      + '<h1>Merci' + p() + ', montrez-nous votre ' + esc(R.produit || 'produit') + '</h1>'
      + '<p class="sous">Prenez une photo du produit que vous avez reçu (le flacon ou la boîte). Elle confirme votre livraison.</p>'
      + (message ? '<div class="conseil or">' + I.info + '<span>' + message + '</span></div>' : '')
      + blocCadeau()
      + '<div class="liste">'
      + '<button class="btn" id="bCam">' + I.photo + 'Prendre la photo maintenant</button>'
      + '<button class="btn clair" id="bGal">' + I.galerie + 'Choisir une photo déjà prise</button>'
      + '<button class="btn lien" id="bTard">' + I.horloge + 'Je ne suis pas à côté du produit</button>'
      + '</div>';
    document.getElementById('bCam').onclick = function(){ document.getElementById('camera').click(); };
    document.getElementById('bGal').onclick = function(){ document.getElementById('galerie').click(); };
    document.getElementById('bTard').onclick = plusTard;
  }
  // La photo est réduite sur le téléphone avant l'envoi (rapide même avec une petite connexion)
  function reduire(fichier, fin){
    var u = URL.createObjectURL(fichier), im = new Image();
    im.onload = function(){
      var m = 1280, k = Math.min(1, m / Math.max(im.width, im.height)), cv = document.createElement('canvas');
      cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(u); fin(cv.toDataURL('image/jpeg', 0.82));
    };
    im.onerror = function(){ URL.revokeObjectURL(u); fin(null); };
    im.src = u;
  }
  function envoyerPhoto(e){
    var f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
    reduire(f, function(data){
      if (!data) return demanderPhoto('Cette image n’a pas pu être ouverte. Essayez une autre photo.');
      z.className = 'carte';
      z.innerHTML = '<div class="apercu"><img alt="" src="' + data + '"></div><div class="charge" style="padding:22px 0 6px"><div class="spin"></div>Vérification de votre photo…</div>';
      appel({type: 'photoRecu', img: data}).then(function(r){
        if (!r || !r.ok) return demanderPhoto(esc((r && r.erreur) || 'La photo n’a pas pu être envoyée. Réessayez.'));
        R.bonus = r.bonus || R.bonus;
        if (r.refusee) return demanderPhoto((r.copie ? 'Cette image ne semble pas être une photo prise chez vous. ' : 'Nous ne reconnaissons pas votre ' + esc(R.produit || 'produit') + ' sur cette photo. ') + (r.raison ? esc(r.raison) + ' ' : '') + 'Photographiez le flacon ou la boîte de face, à la lumière.');
        if (r.aVerifier) {
          z.className = 'carte';
          z.innerHTML = rond(I.coche, '', true) + '<h1>Merci' + p() + ', photo bien reçue</h1><p class="sous">Notre équipe vérifie votre photo et confirme votre livraison. Voici votre cadeau, comme promis.</p>' + boutonCadeau();
          return;
        }
        z.className = 'carte';
        z.innerHTML = rond(I.coche, '', true) + '<h1>Livraison confirmée' + p() + ' !</h1><p class="sous">Votre photo est validée. Merci pour votre confiance. Voici votre cadeau, comme promis.</p>' + boutonCadeau()
          + '<div class="conseil">' + I.info + '<span>Suivez bien les conseils d’utilisation de votre produit pour de meilleurs résultats.</span></div>';
      }).catch(function(){ demanderPhoto('Connexion coupée pendant l’envoi. Vérifiez votre internet puis réessayez.'); });
    });
  }
  document.getElementById('camera').onchange = envoyerPhoto;
  document.getElementById('galerie').onchange = envoyerPhoto;

  // « Je ne suis pas à côté du produit » : le client choisit l'heure du rappel WhatsApp
  function plusTard(){
    var now = new Date(), h = function(j, hh){ var d = new Date(now); d.setDate(d.getDate() + j); d.setHours(hh, 0, 0, 0); return d.getTime(); };
    var choix = [['Dans 1 heure', now.getTime() + 36e5], ['Dans 3 heures', now.getTime() + 3 * 36e5]];
    if (now.getHours() < 18) choix.push(['Ce soir à 19 h', h(0, 19)]);
    choix.push(['Demain matin à 9 h', h(1, 9)], ['Demain à 13 h', h(1, 13)]);
    z.className = 'carte';
    z.innerHTML = rond(I.horloge, 'bleu') + '<h1>Quand serez-vous à côté du produit ?</h1><p class="sous">Nous vous enverrons un rappel sur WhatsApp à l’heure choisie.</p><div class="liste">'
      + choix.map(function(x, i){ return '<button class="btn clair" data-i="' + i + '">' + esc(x[0]) + '</button>'; }).join('')
      + '<button class="btn lien" id="bRet">Retour</button></div>';
    document.getElementById('bRet').onclick = function(){ demanderPhoto(); };
    [].forEach.call(z.querySelectorAll('[data-i]'), function(b){
      b.onclick = function(){
        var x = choix[Number(b.getAttribute('data-i'))];
        attente('Enregistrement…');
        appel({type: 'photoPlusTard', quand: x[1]}).then(function(r){
          if (!r || !r.ok) return erreur('Oups', (r && r.erreur) || 'Le rappel n’a pas pu être enregistré. Réessayez.');
          z.className = 'carte';
          z.innerHTML = rond(I.coche, '', true) + '<h1>C’est noté' + p() + '</h1><p class="sous">Nous vous rappellerons sur WhatsApp ' + esc(x[0].charAt(0).toLowerCase() + x[0].slice(1)) + '. Il suffira d’appuyer sur le bouton pour envoyer la photo.</p>' + blocCadeau();
        }).catch(function(){ erreur('Connexion impossible', 'Vérifiez votre connexion internet puis réessayez.'); });
      };
    });
  }

  if (!c || c.indexOf('.') < 1) return erreur('Lien non valide', 'Ce lien est incomplet. Utilisez les boutons reçus sur WhatsApp.');
  var v = '';
  try { var b = c.slice(0, c.lastIndexOf('.')).replace(/-/g, '+').replace(/_/g, '/'); v = JSON.parse(decodeURIComponent(escape(atob(b + '==='.slice((b.length + 3) % 4))))).v || ''; } catch(e){}
  var rep = Q.get('r') === '1' ? 1 : 0;
  appel({type: 'recu', r: rep}).then(function(r){
    if (!r || !r.ok) return erreur('Oups', (r && r.erreur) || 'Votre réponse n’a pas pu être enregistrée. Réessayez dans un instant.');
    R = r;
    if (r.introuvable) { z.innerHTML = rond(I.coche, '', true) + '<h1>Merci' + p() + ' !</h1><p class="sous">Votre réponse est bien reçue.</p>'; return; }
    if (r.deja) { z.innerHTML = rond(I.coche, '', true) + '<h1>Merci' + p() + ' !</h1><p class="sous">Votre livraison est déjà confirmée.</p>' + boutonCadeau(); return; }
    if (rep) return demanderPhoto(r.dejaPhoto ? 'Votre photo a déjà été reçue et est en cours de vérification. Vous pouvez en envoyer une autre si besoin.' : '');
    z.innerHTML = rond(I.info, 'bleu') + '<h1>Nous nous en occupons' + p() + '</h1><p class="sous">Votre colis n’est pas encore arrivé : notre équipe est prévenue et le livreur va vous rappeler très vite.</p>'
      + '<div class="conseil">' + I.tel + '<span><b>Gardez votre téléphone allumé et décrochez</b>, même si le numéro ne vous est pas connu.</span></div>';
  }).catch(function(){ erreur('Connexion impossible', 'Vérifiez votre connexion internet puis rouvrez le lien.'); });
})();
</script>
</body>
</html>
