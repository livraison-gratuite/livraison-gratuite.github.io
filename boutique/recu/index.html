<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Réception du colis</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F1B3D;--soft:#5B6478;--line:#E3E8F2;--bg:#F4F6FB;--main:#1736A6;--ok:#12A150;--okbg:#E3F5EA}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:28px 16px calc(28px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
.carte{width:100%;max-width:440px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 36px rgba(15,27,61,.08);padding:30px 24px 24px;text-align:center;align-self:flex-start}
.rond{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;background:var(--okbg);display:grid;place-items:center}
.rond svg{width:46px;height:46px;fill:none;stroke:var(--ok);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.rond circle,.rond path{stroke-dasharray:100;stroke-dashoffset:100;animation:trait .7s ease forwards}.rond path{animation-delay:.45s}
@keyframes trait{to{stroke-dashoffset:0}}
h1{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.sous{color:var(--soft);font-size:15.5px;line-height:1.5;margin-top:8px}
.lignes{margin:22px 0 4px;border:1px solid var(--line);border-radius:16px;text-align:left;overflow:hidden}
.ligne{display:flex;justify-content:space-between;gap:14px;padding:13px 16px;font-size:14.5px;border-top:1px solid var(--line)}
.ligne:first-child{border-top:0}.ligne span{color:var(--soft)}.ligne b{text-align:right;font-weight:600}
.ligne.tot{background:#F8FAFD}.ligne.tot b{font-size:16px;font-weight:800}
.conseil{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#EEF3FF;border-radius:14px;padding:14px 16px;margin-top:16px;font-size:14.5px;line-height:1.5;color:#1D2A57}
.conseil svg{flex:0 0 auto;width:22px;height:22px;fill:none;stroke:var(--main);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:18px;width:100%;border-radius:14px;padding:15px;font:700 15.5px Inter,sans-serif;text-decoration:none;color:#fff;background:#128C4A}
.btn svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.charge{padding:40px 0;color:var(--soft);font-size:15px}
.spin{width:34px;height:34px;margin:0 auto 14px;border:3px solid var(--line);border-top-color:var(--main);border-radius:50%;animation:t .8s linear infinite}
@keyframes t{to{transform:rotate(360deg)}}
.erreur .rond{background:#FFF1E6}.erreur .rond svg{stroke:#C2410C}
@media (prefers-reduced-motion:reduce){.rond circle,.rond path{animation:none;stroke-dashoffset:0}}
</style>
</head>
<body>
<main class="carte" id="z"><div class="charge"><div class="spin"></div>Confirmation en cours…</div></main>
<script>
(function(){
  var API = "https://script.google.com/macros/s/AKfycbwgdtcXlXB9niD3hactnz4SLIrpY_q74iQQZwkr1vrUBjczfCCVWwamG69uqnUQZsba/exec";
  var z = document.getElementById('z'), c = new URLSearchParams(location.search).get('c') || '';
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(x){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]; }); };
  var maj = function(s){ s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); };
  var coche = '<div class="rond"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" pathLength="100"/><path d="M7.6 12.4l3 3 5.8-6.2" pathLength="100"/></svg></div>';
  function erreur(t){
    z.className = 'carte erreur';
    z.innerHTML = '<div class="rond"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v5.5M12 16.5h.01"/></svg></div><h1>Lien non valide</h1><p class="sous">' + esc(t) + '</p>';
  }
  if (!c || c.indexOf('.') < 1) return erreur('Ce lien de confirmation est incomplet. Utilisez les boutons reçus sur WhatsApp.');
  var v = '';
  try { var p = c.slice(0, c.lastIndexOf('.')).replace(/-/g, '+').replace(/_/g, '/'); v = JSON.parse(decodeURIComponent(escape(atob(p + '==='.slice((p.length + 3) % 4))))).v || ''; } catch(e){}
  var rep = new URLSearchParams(location.search).get('r') === '1' ? 1 : 0;
  var info = '<div class="rond" style="background:#EEF3FF"><svg viewBox="0 0 24 24" style="stroke:#1736A6"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v5.5M12 16.5h.01"/></svg></div>';
  fetch(API, {method: 'POST', body: JSON.stringify({type: 'recu', c: c, v: v, r: rep})}).then(function(r){ return r.json(); }).then(function(r){
    if (!r || !r.ok) return erreur((r && r.erreur) || 'Votre réponse n’a pas pu être enregistrée. Réessayez dans un instant.');
    var p = r.prenom ? ' ' + esc(r.prenom) : '';
    if (r.introuvable) { z.innerHTML = coche + '<h1>Merci' + p + ' !</h1><p class="sous">Votre réponse est bien reçue.</p>'; return; }
    if (r.deja || rep) {
      z.innerHTML = coche + '<h1>Merci' + p + ' !</h1><p class="sous">' + (r.deja ? 'Votre commande est déjà enregistrée comme livrée.' : 'C’est noté : vous avez bien reçu votre ' + esc(r.produit || 'colis') + '.') + '</p>'
        + '<div class="conseil"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg><span>Merci pour votre confiance' + (r.boutique ? ' envers ' + esc(r.boutique) : '') + '. Suivez bien les conseils d’utilisation pour de meilleurs résultats.</span></div>';
    } else {
      z.innerHTML = info + '<h1>Nous nous en occupons' + p + '</h1><p class="sous">Votre colis n’est pas encore arrivé : notre équipe est prévenue et le livreur va vous rappeler très vite.</p>'
        + '<div class="conseil"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg><span><b>Gardez votre téléphone allumé et décrochez</b>, même si le numéro ne vous est pas connu.</span></div>';
    }
  }).catch(function(){ erreur('Connexion impossible. Vérifiez votre connexion internet puis rouvrez le lien.'); });
})();
</script>
</body>
</html>
