<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Votre commande</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F1B3D;--soft:#5B6478;--line:#E3E8F2;--bg:#F4F6FB;--main:#1736A6;--ok:#12A150;--okbg:#E3F5EA}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:24px 16px calc(28px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
.carte{width:100%;max-width:440px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 36px rgba(15,27,61,.08);padding:24px 20px;align-self:flex-start}
.prod{display:flex;gap:14px;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line)}
.prod img{width:72px;height:72px;border-radius:14px;object-fit:cover;background:#F1F4FA;flex:0 0 auto}
.prod b{display:block;font-size:16px;line-height:1.3}.prod span{font-size:13px;color:var(--soft)}
h1{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin-top:18px}
.sous{color:var(--soft);font-size:15px;line-height:1.55;margin-top:6px}
.bloc{margin-top:20px}.bloc label,.bloc .lib{display:block;font-size:14.5px;font-weight:700;margin-bottom:8px}
.offres{display:flex;flex-direction:column;gap:8px}
.offres button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;font:500 15px Inter,sans-serif;color:var(--ink);cursor:pointer}
.offres button b{font-weight:800;white-space:nowrap}
.offres button.on{border-color:var(--main);background:#EEF3FF;color:var(--main)}
input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:500 15px Inter,sans-serif;color:var(--ink);background:#fff}
input:focus{outline:2px solid #C9D6FF;border-color:var(--main)}
.tel{font-size:15px;font-weight:600;background:#F7F9FD;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.atouts{margin-top:18px;background:#F7F9FD;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.atouts div{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600}
.atouts svg{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:var(--ok);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.btn{display:flex;align-items:center;justify-content:center;width:100%;border:0;cursor:pointer;border-radius:14px;padding:16px;font:700 16px Inter,sans-serif;color:#fff;background:var(--ok);margin-top:20px;text-decoration:none}
.btn.clair{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:600;font-size:15px;margin-top:10px}
.btn:disabled{opacity:.6}
.err{color:#B42318;font-size:14px;margin-top:12px;line-height:1.45;min-height:18px}
.fin{text-align:center;padding:10px 0}
.rond{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;background:var(--okbg);display:grid;place-items:center}
.rond svg{width:46px;height:46px;fill:none;stroke:var(--ok);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.lignes{margin:20px 0 4px;border:1px solid var(--line);border-radius:16px;text-align:left;overflow:hidden}
.ligne{display:flex;justify-content:space-between;gap:14px;padding:12px 16px;font-size:14.5px;border-top:1px solid var(--line)}
.ligne:first-child{border-top:0}.ligne span{color:var(--soft)}.ligne b{text-align:right;font-weight:600}
.charge{padding:40px 0;color:var(--soft);font-size:15px;text-align:center}
.spin{width:34px;height:34px;margin:0 auto 14px;border:3px solid var(--line);border-top-color:var(--main);border-radius:50%;animation:t .8s linear infinite}
@keyframes t{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main class="carte" id="z"><div class="charge"><div class="spin"></div>Chargement…</div></main>
<script>
(function(){
  var API = "https://script.google.com/macros/s/AKfycbwgdtcXlXB9niD3hactnz4SLIrpY_q74iQQZwkr1vrUBjczfCCVWwamG69uqnUQZsba/exec";
  var z = document.getElementById('z'), c = new URLSearchParams(location.search).get('c') || '', V = '', B = '';
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(x){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]; }); };
  var coche = '<div class="rond"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M7.6 12.4l3 3 5.8-6.2"/></svg></div>';
  var ok = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></svg>';
  var money = function(n, d){ return Math.round(Number(n) || 0).toLocaleString('fr-FR').replace(/[  ]/g, ' ') + ' ' + (d || 'FCFA'); };
  function appel(o){ o.v = V; o.b = B; return fetch(API, {method: 'POST', body: JSON.stringify(o)}).then(function(r){ return r.json(); }); }
  function erreur(t){ z.innerHTML = '<div class="fin"><h1>Lien non valide</h1><p class="sous">' + esc(t) + '</p></div>'; }
  if (!c || c.indexOf('.') < 1) return erreur('Ce lien est incomplet. Utilisez le bouton reçu sur WhatsApp.');
  try { var b = c.slice(0, c.lastIndexOf('.')).replace(/-/g, '+').replace(/_/g, '/'), j = JSON.parse(decodeURIComponent(escape(atob(b + '==='.slice((b.length + 3) % 4))))); V = j.v || ''; B = j.b || ''; } catch(e){}
  function photo(u){ u = String(u || ''); var m = u.match(/\/d\/([\w-]{20,})|[?&]id=([\w-]{20,})/); if (m) return 'https://drive.google.com/thumbnail?id=' + (m[1] || m[2]) + '&sz=w300'; return /^https?:/.test(u) ? u : (u ? '../' + u.replace(/^\.?\//, '') : ''); }
  var R = {}, choix = '';
  function formulaire(){
    var off = R.offres || [];
    z.innerHTML = '<div class="prod">' + (R.photo ? '<img alt="" src="' + esc(photo(R.photo)) + '">' : '') + '<div><span>Votre commande</span><b>' + esc(R.produit) + '</b></div></div>'
      + '<h1>' + (R.nom ? esc(R.nom.split(/\s+/)[0]) + ', on' : 'On') + ' vous la livre ?</h1>'
      + '<p class="sous">Vérifiez vos informations puis validez : notre équipe vous appelle pour fixer l’heure de livraison.</p>'
      + (off.length > 1 ? '<div class="bloc"><div class="lib">Votre offre</div><div class="offres">' + off.map(function(o){ return '<button type="button" data-k="' + esc(o.key) + '"><span>' + esc(o.label) + '</span><b>' + money(o.prix, R.devise) + '</b></button>'; }).join('') + '</div></div>'
        : '<div class="bloc"><div class="lib">Votre offre</div><div class="offres"><button type="button" class="on" data-k="' + esc((off[0] || {}).key || '') + '"><span>' + esc((off[0] || {}).label || '') + '</span><b>' + money((off[0] || {}).prix, R.devise) + '</b></button></div></div>')
      + '<div class="bloc"><label for="nom">Votre nom</label><input type="text" id="nom" maxlength="80" value="' + esc(R.nom) + '"></div>'
      + '<div class="bloc"><label for="ville">Ville ou commune</label><input type="text" id="ville" maxlength="60" value="' + esc(R.ville) + '"></div>'
      + '<div class="bloc"><label for="adr">Quartier et repère</label><input type="text" id="adr" maxlength="300" value="' + esc(R.adresse) + '" placeholder="ex. quartier, près de la pharmacie"></div>'
      + '<div class="bloc"><div class="lib">Votre numéro</div><div class="tel">' + esc(R.tel) + '</div></div>'
      + '<div class="atouts"><div>' + ok + 'Livraison gratuite</div><div>' + ok + 'Vous payez à la réception, après avoir vu votre colis</div></div>'
      + '<button class="btn" id="go">Oui, je veux être livré</button><div class="err" id="er"></div>'
      + (R.wa ? '<a class="btn clair" href="../wa/?n=' + esc(R.wa) + '">Écrire au service client</a>' : '');
    choix = R.offre || ((off[0] || {}).key || '');
    [].forEach.call(z.querySelectorAll('.offres button'), function(bt){
      bt.classList.toggle('on', bt.getAttribute('data-k') === choix);
      bt.onclick = function(){ choix = bt.getAttribute('data-k'); [].forEach.call(z.querySelectorAll('.offres button'), function(x){ x.classList.toggle('on', x === bt); }); };
    });
    document.getElementById('go').onclick = commander;
  }
  function commander(){
    var nom = document.getElementById('nom').value.trim(), ville = document.getElementById('ville').value.trim(), adr = document.getElementById('adr').value.trim(), er = document.getElementById('er'), go = document.getElementById('go');
    if (nom.length < 2) return er.textContent = 'Indiquez votre nom.';
    if (ville.length < 2) return er.textContent = 'Indiquez votre ville ou commune.';
    if (adr.length < 3) return er.textContent = 'Indiquez votre quartier et un repère, pour que le livreur vous trouve.';
    var o = (R.offres || []).find(function(x){ return x.key === choix; }) || (R.offres || [])[0] || {};
    er.textContent = ''; go.disabled = true; go.textContent = 'Validation en cours…';
    var payload = { hp: '', dt: 30000, produit: R.prodId, pays: R.pays, offre: o.key, nom: nom, tel: R.tel, ville: ville, adresse: adr, jour: '', moment: '',
      page: location.origin + location.pathname, attrib: { utm_source: 'relance whatsapp' }, relance: c, rid: 'rel' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
      secours: { total: o.prix, label: o.label, qte: 1 } };
    var essai = function(n){
      return appel(payload).catch(function(){ if (n < 2) return new Promise(function(r){ setTimeout(r, 1500); }).then(function(){ return essai(n + 1); }); throw new Error('reseau'); });
    };
    essai(0).then(function(r){
      if (r && r.doublon) return merci({ numero: r.numero, produit: R.produit, offre: o.label, total: money(o.prix, R.devise) }, true);
      if (!r || !r.ok || !r.numero || r.numero === '—') throw new Error((r && r.erreur) || 'La validation n’a pas abouti. Réessayez.');
      merci({ numero: r.numero, produit: r.produit || R.produit, offre: r.offre || o.label, total: money(r.total || o.prix, r.devise || R.devise), adresse: r.adresse }, false);
      if (r.jc) confirmer(r.jc, 0);
    }).catch(function(e){ go.disabled = false; go.textContent = 'Oui, je veux être livré';
      er.textContent = e && e.message && e.message !== 'reseau' && !/fetch|network|json/i.test(e.message) ? e.message : 'Connexion coupée. Vérifiez votre internet puis réessayez.'; });
  }
  // Le client a dit oui : la livraison est confirmée tout de suite (la closeuse reçoit la fiche du livreur)
  function confirmer(jc, n){
    fetch(API, {method: 'POST', body: JSON.stringify({ type: 'confirmer', c: jc })}).then(function(r){ return r.json(); }).then(function(r){
      if (r && r.ok && r.introuvable && n < 8) setTimeout(function(){ confirmer(jc, n + 1); }, 8000);
    }).catch(function(){ if (n < 8) setTimeout(function(){ confirmer(jc, n + 1); }, 8000); });
  }
  function merci(x, deja){
    z.innerHTML = '<div class="fin">' + coche + '<h1>' + (deja ? 'Commande déjà enregistrée' : 'Commande validée') + '</h1>'
      + '<p class="sous">Merci' + (R.nom ? ' ' + esc(R.nom.split(/\s+/)[0]) : '') + ' ! Notre équipe vous appelle très vite pour fixer l’heure de livraison. Gardez votre téléphone allumé et décrochez.</p>'
      + '<div class="lignes">' + (x.numero ? '<div class="ligne"><span>Commande</span><b>n°' + esc(x.numero) + '</b></div>' : '')
      + '<div class="ligne"><span>Produit</span><b>' + esc(x.produit) + '</b></div>'
      + (x.offre ? '<div class="ligne"><span>Offre</span><b>' + esc(x.offre) + '</b></div>' : '')
      + (x.total ? '<div class="ligne"><span>À payer à la réception</span><b>' + esc(x.total) + '</b></div>' : '') + '</div></div>';
  }
  appel({ type: 'repriseInfos', c: c }).then(function(r){
    if (!r || !r.ok) return erreur((r && r.erreur) || 'Ce lien ne fonctionne pas.');
    if (r.introuvable) return erreur('Ce produit n’est plus disponible.');
    R = r;
    if (r.deja) return merci({ numero: r.numero, produit: r.produit, offre: '', total: '' }, true);
    formulaire();
  }).catch(function(){ erreur('Connexion impossible. Vérifiez votre internet puis rouvrez le lien.'); });
})();
</script>
</body>
</html>
